name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"   # 每天 UTC 0 点自动更新
  workflow_dispatch:      # 允许手动触发

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install snk (snake generator)
        run: npm install -g snk

      - name: Generate light version
        run: snk --username ${{ github.repository_owner }} --output dist/github-snake.svg

      - name: Generate dark version
        run: snk --username ${{ github.repository_owner }} --output dist/github-snake-dark.svg --palette github-dark

      - name: Push to output branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          commit_message: "Update snake animation [skip ci]"